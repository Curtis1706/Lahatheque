name: Frontend CI - Validation TypeScript & Build

on:
  push:
    branches: [main, master]
    paths:
      - 'lahatheque-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lahatheque-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  validate-frontend:
    name: Lint & Compilation TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lahatheque-frontend

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./lahatheque-frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci --prefer-offline --no-audit

      - name: Vérification du linting
        run: npm run lint

      - name: Validation du build de production (Turbopack / App Router)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
